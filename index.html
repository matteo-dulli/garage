<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage ANPR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-wrapper">

    <!-- Connection status bar -->
    <div id="connection-status-bar" class="checking">
        <i class="bi bi-circle-fill"></i>
        <span id="connection-text">Verifica connessione...</span>
        <span class="ms-auto" id="connection-time"></span>
    </div>

    <!-- Top navbar -->
    <nav class="navbar navbar-dark bg-dark px-3 py-1" style="min-height:var(--header-height)">
        <a class="navbar-brand fw-bold fs-5 d-flex align-items-center gap-2" href="#">
            <i class="bi bi-p-square-fill text-warning"></i> Garage ANPR
        </a>
        <div class="d-flex gap-2 align-items-center">
            <div class="input-group input-group-sm" style="width:220px">
                <input type="text" id="global-search" class="form-control" placeholder="Cerca targa o ticket…">
                <button class="btn btn-outline-secondary" onclick="doSearch()"><i class="bi bi-search"></i></button>
            </div>
            <button class="btn btn-sm btn-outline-light" onclick="scanFolder()" title="Scansiona cartella ANPR">
                <i class="bi bi-folder2-open"></i>
            </button>
            <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#modalNewPlate">
                <i class="bi bi-plus-circle"></i> Targa
            </button>
            <button class="btn btn-sm btn-info text-dark" data-bs-toggle="modal" data-bs-target="#modalNewTicket">
                <i class="bi bi-ticket-perforated"></i> Ticket
            </button>
        </div>
    </nav>

    <!-- Stats bar -->
    <div id="stats-bar">
        <div class="stat-item">
            <i class="bi bi-car-front text-primary"></i>
            <span class="stat-label">Presenti:</span>
            <span class="stat-value" id="stat-inside">—</span>
        </div>
        <div class="stat-item">
            <i class="bi bi-ticket text-success"></i>
            <span class="stat-label">Ticket oggi:</span>
            <span class="stat-value" id="stat-tickets">—</span>
        </div>
        <div class="stat-item">
            <i class="bi bi-list-ul text-secondary"></i>
            <span class="stat-label">Totale targhe:</span>
            <span class="stat-value" id="stat-total">—</span>
        </div>
        <div class="ms-auto">
            <button class="btn btn-sm btn-outline-secondary" onclick="loadPlates(true)">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>

    <!-- Main row -->
    <div id="main-row">

        <!-- Left sidebar: plates list -->
        <div id="plates-sidebar">
            <div id="sidebar-toolbar">
                <div class="input-group input-group-sm">
                    <span class="input-group-text"><i class="bi bi-funnel"></i></span>
                    <input type="text" id="search-input" class="form-control" placeholder="Filtra targa…" oninput="onSearchInput()">
                </div>
                <select id="filter-status" class="form-select form-select-sm" onchange="filterAndRenderPlates()">
                    <option value="all">Tutte</option>
                    <option value="inside">In struttura</option>
                    <option value="outside">Usciti</option>
                    <option value="ticket">Con ticket</option>
                    <option value="subscription">Abbonati</option>
                </select>
            </div>
            <ul class="plates-list" id="plates-list">
                <li class="p-3 text-muted text-center small">
                    <i class="bi bi-hourglass-split"></i> Caricamento…
                </li>
            </ul>
        </div>

        <!-- Right: detail panel -->
        <div id="detail-panel-wrapper">
            <div class="detail-panel" id="detail-panel">
                <div id="detail-placeholder" class="h-100">
                    <i class="bi bi-arrow-left-circle fs-1 mb-3"></i>
                    <p>Seleziona una targa dalla lista</p>
                </div>
            </div>
        </div>

    </div><!-- #main-row -->

</div><!-- #app-wrapper -->

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ── Modal: Nuova Targa ────────────────────────────────── -->
<div class="modal fade" id="modalNewPlate" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title"><i class="bi bi-plus-circle"></i> Nuova Targa</h6>
                <button type="button" class="btn-close btn-sm" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label class="form-label">Numero targa *</label>
                    <input type="text" id="new-plate-number" class="form-control form-control-sm text-uppercase"
                           placeholder="AB123CD" maxlength="10">
                </div>
                <div class="mb-2">
                    <label class="form-label">Tipo</label>
                    <input type="text" id="new-plate-tipo" class="form-control form-control-sm" placeholder="Transito, Abbonato…">
                </div>
                <div class="mb-2">
                    <label class="form-label">Note</label>
                    <textarea id="new-plate-notes" class="form-control form-control-sm" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer py-2">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Annulla</button>
                <button type="button" class="btn btn-sm btn-primary" onclick="createManualPlate()">
                    <i class="bi bi-check2"></i> Crea
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ── Modal: Nuovo Ticket Manuale ─────────────────────── -->
<div class="modal fade" id="modalNewTicket" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title"><i class="bi bi-ticket-perforated"></i> Ticket Manuale</h6>
                <button type="button" class="btn-close btn-sm" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <label class="form-label">Numero targa</label>
                    <input type="text" id="new-ticket-plate" class="form-control form-control-sm text-uppercase"
                           placeholder="AB123CD" maxlength="10">
                </div>
                <div class="mb-2">
                    <label class="form-label">Importo (€)</label>
                    <input type="number" id="new-ticket-amount" class="form-control form-control-sm"
                           placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="mb-2">
                    <label class="form-label">Note</label>
                    <textarea id="new-ticket-notes" class="form-control form-control-sm" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer py-2">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Annulla</button>
                <button type="button" class="btn btn-sm btn-info text-dark" onclick="createManualTicket()">
                    <i class="bi bi-check2"></i> Emetti
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Application scripts -->
<script src="js/app.js"></script>
<script src="js/connection.js"></script>
<script src="js/ui.js"></script>
<script src="js/details.js"></script>
<script src="js/plate-management.js"></script>
<script src="js/plates.js"></script>

<!-- Module scripts -->
<script src="js/moduli/modulo1.js"></script>
<script src="js/moduli/modulo2.js"></script>
<script src="js/moduli/modulo3.js"></script>
<script src="js/moduli/modulo4.js"></script>
<script src="js/moduli/modulo5.js"></script>
<script src="js/moduli/modulo6.js"></script>

</body>
</html>
