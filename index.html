<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage ANPR</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Connection status bar -->
    <div id="connection-status-bar" class="connection-bar bg-success text-white py-1 px-3 d-flex align-items-center gap-2">
        <span id="connection-icon"><i class="bi bi-wifi"></i></span>
        <span id="connection-text">Connesso</span>
        <span id="last-update-time" class="ms-auto small"></span>
    </div>

    <div class="container-fluid py-3">
        <!-- Header -->
        <div class="row mb-3 align-items-center">
            <div class="col">
                <h4 class="mb-0"><i class="bi bi-camera"></i> Garage ANPR</h4>
            </div>
            <div class="col-auto">
                <!-- Stats bar -->
                <div id="stats-bar" class="d-flex gap-3 small text-muted">
                    <span><i class="bi bi-car-front"></i> <span id="stat-plates">0</span> targhe</span>
                    <span><i class="bi bi-arrow-left-right"></i> <span id="stat-passages">0</span> passaggi</span>
                    <span><i class="bi bi-ticket"></i> <span id="stat-tickets">0</span> ticket</span>
                </div>
            </div>
        </div>

        <!-- Search & Filters -->
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="search-input" class="form-control" placeholder="Cerca targa o codice ticket...">
                    <button class="btn btn-outline-secondary" type="button" id="btn-clear-search">
                        <i class="bi bi-x"></i>
                    </button>
                </div>
            </div>
            <div class="col-md-3">
                <select id="filter-status" class="form-select">
                    <option value="all">Tutti</option>
                    <option value="inside">In garage</option>
                    <option value="outside">Usciti</option>
                    <option value="ticket">Con ticket</option>
                    <option value="subscription">Abbonati</option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-primary" id="btn-new-plate" title="Nuova targa manuale">
                    <i class="bi bi-plus-circle"></i> Targa
                </button>
                <button class="btn btn-success" id="btn-new-ticket" title="Nuovo ticket manuale">
                    <i class="bi bi-ticket-perforated"></i> Ticket
                </button>
                <button class="btn btn-secondary" id="btn-scan" title="Scansiona cartella ANPR">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </div>

        <!-- Main content: plates list + detail panel -->
        <div class="row">
            <!-- Left: Plates list -->
            <div class="col-md-5 col-lg-4" id="plates-list-col">
                <div id="plates-list" class="plates-list">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-hourglass-split fs-2"></i>
                        <p class="mt-2">Caricamento...</p>
                    </div>
                </div>
            </div>

            <!-- Right: Detail panel -->
            <div class="col-md-7 col-lg-8" id="detail-col">
                <div id="detail-panel" class="detail-panel">
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-car-front fs-2"></i>
                        <p class="mt-2">Seleziona una targa per vedere i dettagli</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <!-- Modal: New Plate -->
    <div class="modal fade" id="modalNewPlate" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle"></i> Nuova Targa Manuale</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-new-plate">
                        <div class="mb-3">
                            <label class="form-label">Targa *</label>
                            <input type="text" class="form-control text-uppercase" id="new-plate-number" required maxlength="10" placeholder="AB123CD">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo</label>
                            <select class="form-select" id="new-plate-type">
                                <option value="transit">Transito</option>
                                <option value="subscription">Abbonamento</option>
                                <option value="authorized">Autorizzato</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Note</label>
                            <textarea class="form-control" id="new-plate-notes" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                    <button type="button" class="btn btn-primary" id="btn-save-new-plate">Salva</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: New Ticket -->
    <div class="modal fade" id="modalNewTicket" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-ticket-perforated"></i> Nuovo Ticket Manuale</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-new-ticket">
                        <div class="mb-3">
                            <label class="form-label">Targa (opzionale)</label>
                            <input type="text" class="form-control text-uppercase" id="new-ticket-plate" maxlength="10" placeholder="AB123CD">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Importo (€)</label>
                            <input type="number" class="form-control" id="new-ticket-amount" step="0.01" min="0" placeholder="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Note</label>
                            <textarea class="form-control" id="new-ticket-notes" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                    <button type="button" class="btn btn-success" id="btn-save-new-ticket">Crea Ticket</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App scripts - ORDER MATTERS -->
    <script src="js/app.js"></script>
    <script src="js/connection.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/details.js"></script>
    <script src="js/plate-management.js"></script>
    <script src="js/plates.js"></script>
</body>
</html>
